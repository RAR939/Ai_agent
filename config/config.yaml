# Все настройки без правки кода (docs/contracts.md, раздел 6).
models:
  llm: "qwen3:8b"
  embed: "bge-m3"
  reranker: "BAAI/bge-reranker-v2-m3"
  temperature: 0.1

retrieval:
  chunk_strategy: "window"   # window | thread | day
  window_size: 10
  window_step: 5
  max_chunk_chars: 1800
  candidates: 20
  rerank_top: 15
  top_k: 5
  min_score: 0.3             # порог релевантности
  use_reranker: true
  bm25: {k1: 1.5, b: 0.75}

tracker:
  # слова ищутся по леммам (сдаём -> сдавать), поэтому достаточно начальной формы
  prefilter_keywords: ["сдать", "сдавать", "сдача", "срок", "дедлайн", "перенести",
                       "отмена", "отменить", "отменяться", "рубежка", "рубежный", "рк",
                       "зачёт", "экзамен", "дз", "лаба", "лаб", "лабораторный", "лр",
                       "домашка", "домашний", "контрольная", "кр", "курсовая", "курсач",
                       "защита", "горит"]
  # сильные слова: сообщение проходит и без признака времени («ДЗ 1 отменяется»)
  prefilter_strong_keywords: ["отмена", "отменить", "отменяться", "отменять", "перенести", "переносить"]
  # слова-признаки времени (тоже по леммам); даты 12.11, «12 ноября» и время 18:00 ловятся регулярками
  prefilter_time_words: ["завтра", "послезавтра", "сегодня", "неделя", "пара", "следующий",
                         "ближайший", "день", "скоро", "понедельник", "вторник", "среда",
                         "четверг", "пятница", "суббота", "воскресенье", "пн", "вт", "ср",
                         "чт", "пт", "сб", "вс", "конец", "через", "занятие", "семинар", "лекция"]
  remind_hours: 24            # за сколько часов до срока напоминать (задача 4.10)
  context_messages: 3         # сколько предыдущих сообщений видит модель (задача 4.5)
  date_rollover_days: 30      # дата дд.мм старше стольких дней уходит на следующий год (4.6)
  confidence_threshold: 0.7
  similarity_threshold: 85
  attach_window_min: 10
  attach_exts: [pdf, docx, doc, xlsx, pptx, zip, rar, txt, odt]
  attach_max_per_msg: 5

schedule:
  semester_start: "2026-09-01"
  semester_end: "2026-12-27"    # конец семестра: до этой даты разворачивается Excel-расписание
  first_week_parity: "odd"
  holidays: []

agent:
  max_steps: 5
  timeout_sec: 120
  mode: "llm"                # llm | rules (запасной режим: маршрутизация по ключевым словам)
  routing_rules:             # инструмент: основы слов для режима rules
    list_deadlines: ["сда", "срок", "дедлайн", "горит", "когда"]
    get_schedule: ["пар", "расписани", "заняти", "завтра"]

ui:
  use_mock: true

paths:
  data: "data"
  db: "data/helper.db"
  logs: "logs"
